<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>じゃんけんゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>✊✌✋ じゃんけんゲーム</h1>

  <div class="buttons">
    <button onclick="play('グー')">✊</button>
    <button onclick="play('チョキ')">✌</button>
    <button onclick="play('パー')">✋</button>
  </div>

  <p id="result">ここに結果が表示されます</p>

  <div class="score">
    <p>勝ち：<span id="win">0</span></p>
    <p>負け：<span id="lose">0</span></p>
    <p>あいこ：<span id="draw">0</span></p>
    <p>勝率：<span id="rate">0</span>%</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
